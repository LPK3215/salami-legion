<rect width="1080" height="556" fill="url(#bg2)"/>
<text x="30" y="44" font-size="24" font-weight="800" fill="url(#ttl2)">核心差异 · 逐个单位吞噬</text>
<text x="30" y="72" font-size="12.5" fill="rgba(234,241,255,.62)">同一支 3 人军团遇上 5 人敌军后的人数变化。台阶间隔严格等于配置值；双方初始人数（敌 5 / 我 3）为机制示意值，不是实测数据。</text>
  <line x1="132" y1="94" x2="158" y2="94" stroke="#ff5b6e" stroke-width="3"/>
