  <text x="826.0" y="391.0" text-anchor="middle" font-size="12.5" fill="rgba(234,241,255,.72)">把对方盖进自己的圆盘里 →</text>
  <text x="826.0" y="409.0" text-anchor="middle" font-size="12.5" fill="#ffd93d">一拍吞 2 个（上限 10 个/批）</text>
  <text x="120" y="330.0" text-anchor="end" font-size="11" fill="rgba(234,241,255,.72)">8</text>
  <text x="120" y="460.0" text-anchor="end" font-size="11" fill="rgba(234,241,255,.72)">0</text>
  <text x="132" y="510" font-size="11.5" fill="rgba(234,241,255,.72)">纵轴：军团人数　横轴：接触后经过的秒数（每个台阶 = 一次结算；实线每台阶 1 个，虚线每台阶 2 个）</text>
  <text x="1010" y="510" text-anchor="end" font-size="12.5" fill="#ffd93d">→ 消耗期间人数随时可能反超：怎么接触、什么时候撤，才是这游戏的技术含量</text>
<text x="30" y="542" font-size="11.5" fill="rgba(234,241,255,.72)">生成于 2026-10-06｜数据真源 js/config.js（CFG.eat）｜版本 v1.4.0</text>
