<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 556" width="1080" height="556" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="逐个单位吞噬与一次性吞并的对比">
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a0f24"/><stop offset="100%" stop-color="#141c3d"/>
  </linearGradient>
  <linearGradient id="ttl2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffd93d"/><stop offset="100%" stop-color="#ff5b6e"/>
