<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 556" width="1080" height="556" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="按拍吞噬（擦边逐个吞、覆盖同批吞）与一次性吞并的对比">
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a0f24"/><stop offset="100%" stop-color="#141c3d"/>
  </linearGradient>
  <linearGradient id="ttl2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffd93d"/><stop offset="100%" stop-color="#ff5b6e"/>
  </linearGradient>
</defs>
<rect width="1080" height="556" fill="url(#bg2)"/>
<text x="30" y="44" font-size="24" font-weight="800" fill="url(#ttl2)">核心差异 · 按拍吞噬，盖住多少吞多少</text>
<text x="30" y="72" font-size="12.5" fill="rgba(234,241,255,.72)">同一支 3 人军团遇上 5 人敌军后的人数变化。台阶间隔严格等于配置值；双方初始人数（敌 5 / 我 3）与虚线的「每拍被盖住 2 个」均为机制示意值，不是实测数据。</text>
  <line x1="132" y1="94" x2="158" y2="94" stroke="#ff5b6e" stroke-width="3"/>
  <text x="166" y="98" font-size="12.5" fill="#ff5b6e">敌方军团人数</text>
  <line x1="272" y1="94" x2="298" y2="94" stroke="#3d9bff" stroke-width="3"/>
  <text x="306" y="98" font-size="12.5" fill="#3d9bff">我方军团人数</text>
  <text x="1010" y="98" text-anchor="end" font-size="11.5" fill="rgba(234,241,255,.72)">节奏真源 js/config.js → CFG.eat.interval = 0.32s，contact = 0.94，batchMax = 10/批</text>
  <text x="30" y="124" font-size="14.5" font-weight="700" fill="rgba(234,241,255,.72)">同类做法 · 接触瞬间整队吞并</text>
  <rect x="132" y="136" width="878" height="122" rx="8" fill="rgba(255,255,255,.03)" stroke="rgba(234,241,255,.72)" stroke-opacity=".28"/>
