  <line x1="272" y1="94" x2="298" y2="94" stroke="#3d9bff" stroke-width="3"/>
  <text x="306" y="98" font-size="12.5" fill="#3d9bff">我方军团人数</text>
  <text x="1010" y="98" text-anchor="end" font-size="11.5" fill="rgba(234,241,255,.62)">节奏真源 js/config.js → CFG.eat.interval = 0.32s，contact = 0.94</text>
  <text x="30" y="124" font-size="14.5" font-weight="700" fill="rgba(234,241,255,.62)">同类做法 · 接触瞬间整队吞并</text>
