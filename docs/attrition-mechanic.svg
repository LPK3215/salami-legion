  <path d="M170.0 208.8 L170.0 150.0 L990.0 150.0" fill="none" stroke="#3d9bff" stroke-width="2.8" stroke-opacity=".9"/>
  <text x="982" y="201.0" text-anchor="end" font-size="12.5" fill="rgba(234,241,255,.72)">胜负在碰上的那一刻就定死</text>
  <text x="120" y="154.0" text-anchor="end" font-size="11" fill="rgba(234,241,255,.72)">8</text>
  <text x="120" y="248.0" text-anchor="end" font-size="11" fill="rgba(234,241,255,.72)">0</text>
  <text x="30" y="300" font-size="14.5" font-weight="700" fill="#ffd93d">本作《蚕食军团》· 每 0.32s 结算一批：实线 = 擦边（1 个/拍），虚线 = 被盖住 2 个/拍</text>
