  <text x="120" y="154.0" text-anchor="end" font-size="11" fill="rgba(234,241,255,.62)">8</text>
  <text x="120" y="248.0" text-anchor="end" font-size="11" fill="rgba(234,241,255,.62)">0</text>
  <text x="30" y="300" font-size="14.5" font-weight="700" fill="#ffd93d">本作《蚕食军团》· 每 0.32s 才转移 1 个单位（阶梯逐个消耗）</text>
